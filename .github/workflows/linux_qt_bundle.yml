name: Build Linux (Qt bundled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-qt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      name: checkout

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype-dev zlib1g-dev ninja-build patchelf libxcb-cursor0 file

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        modules: 'qtmultimedia'

    - name: Build
      run: |
        set -eu
        mkdir build
        cd build
        cmake ../ -G Ninja -DTSMUXER_GUI=ON -DCMAKE_BUILD_TYPE=Release
        ninja

    - name: Bundle Qt into a portable package
      run: |
        set -eu
        STAGE="tsMuxeR-linux-x64-portable"
        mkdir -p "$STAGE/lib" "$STAGE/plugins"

        find build -maxdepth 3 -type f -iname tsmuxer    -exec cp {} "$STAGE/tsMuxeR" \;
        find build -maxdepth 3 -type f -iname tsmuxergui -exec cp {} "$STAGE/tsMuxerGUI.bin" \;
        for f in tsMuxeR tsMuxerGUI.bin; do
          if [ ! -f "$STAGE/$f" ]; then
            echo "::error::$STAGE/$f was not built."
            exit 1
          fi
        done
        chmod +x "$STAGE/tsMuxeR" "$STAGE/tsMuxerGUI.bin"

        QMAKE_BIN="$(command -v qmake6 || command -v qmake)"
        QT_LIBS="$("$QMAKE_BIN" -query QT_INSTALL_LIBS)"
        QT_PLUGINS="$("$QMAKE_BIN" -query QT_INSTALL_PLUGINS)"
        echo "Qt libs dir: $QT_LIBS"
        echo "Qt plugins dir: $QT_PLUGINS"

        for d in platforms imageformats iconengines platforminputcontexts tls multimedia xcbglintegrations; do
          if [ -d "$QT_PLUGINS/$d" ]; then
            cp -rL "$QT_PLUGINS/$d" "$STAGE/plugins/"
          fi
        done

        # Collect Qt libs needed by the binary AND by every bundled plugin
        # (e.g. libqxcb.so needs libQt6XcbQpa.so.6, which the binary does not link)
        {
          ldd "$STAGE/tsMuxerGUI.bin"
          find "$STAGE/plugins" -name '*.so' -exec ldd {} +
        } | awk '{print $3}' | grep -F "$QT_LIBS" | sort -u | while read -r lib; do
          cp -L "$lib" "$STAGE/lib/"
        done

        # Qt >= 6.5 xcb platform dlopen()s libxcb-cursor.so.0 at runtime, so ldd
        # never lists it. Bundle it explicitly together with its own dependencies.
        for lib in libxcb-cursor.so.0 libxcb-util.so.1 libxcb-image.so.0 libxcb-render-util.so.0; do
          src="$(find /usr/lib/x86_64-linux-gnu -maxdepth 1 -name "$lib" -print -quit || true)"
          if [ -n "$src" ]; then
            cp -L "$src" "$STAGE/lib/"
            echo "bundled $lib"
          else
            echo "::warning::$lib not found on the runner"
          fi
        done
        if [ ! -f "$STAGE/lib/libxcb-cursor.so.0" ]; then
          echo "::error::libxcb-cursor.so.0 was not bundled; the xcb platform plugin will fail to load."
          exit 1
        fi

        patchelf --set-rpath '$ORIGIN/lib' "$STAGE/tsMuxerGUI.bin"
        printf '[Paths]\nPrefix = .\nPlugins = plugins\n' > "$STAGE/qt.conf"

        cat > "$STAGE/tsMuxerGUI" <<'LAUNCHER'
        #!/bin/sh
        cd "$(dirname "$0")" || exit 1
        export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        export QT_PLUGIN_PATH="$PWD/plugins"
        exec "$PWD/tsMuxerGUI.bin" "$@"
        LAUNCHER
        chmod +x "$STAGE/tsMuxerGUI"

        cd "$STAGE"
        missing=$( { LD_LIBRARY_PATH="$PWD/lib" ldd tsMuxerGUI.bin; find plugins -name '*.so' -exec env LD_LIBRARY_PATH="$PWD/lib" ldd {} +; } | grep 'not found' | grep -E 'libQt6|libicu' || true )
        if [ -n "$missing" ]; then
          echo "::error::The bundle misses Qt libraries: $missing"
          exit 1
        fi
        cd ..

        "$STAGE/tsMuxeR" 2>&1 | head -n 1 || true
        tar -czf "$STAGE.tar.gz" "$STAGE"
        sha256sum "$STAGE.tar.gz"

    - name: Build AppImage (single-file executable)
      run: |
        set -eu
        STAGE="tsMuxeR-linux-x64-portable"
        APPDIR="AppDir"
        mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/plugins"
        cp "$STAGE/tsMuxerGUI.bin" "$APPDIR/usr/bin/"
        cp "$STAGE/tsMuxeR" "$APPDIR/usr/bin/"
        cp -r "$STAGE/lib/." "$APPDIR/usr/lib/"
        cp -r "$STAGE/plugins/." "$APPDIR/usr/plugins/"

        cat > "$APPDIR/AppRun" <<'APPRUN'
        #!/bin/sh
        HERE="$(cd "$(dirname "$0")" && pwd)"
        export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        export QT_PLUGIN_PATH="$HERE/usr/plugins"
        export PATH="$HERE/usr/bin:$PATH"
        exec "$HERE/usr/bin/tsMuxerGUI.bin" "$@"
        APPRUN
        chmod +x "$APPDIR/AppRun"

        cat > "$APPDIR/tsMuxerGUI.desktop" <<'DESKTOP'
        [Desktop Entry]
        Type=Application
        Name=tsMuxerGUI
        Comment=Blu-ray muxer GUI
        Exec=tsMuxerGUI
        Icon=tsMuxerGUI
        Categories=AudioVideo;Video;
        Terminal=false
        DESKTOP

        cp tsMuxerGUI/images/icon.png "$APPDIR/tsMuxerGUI.png"

        curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        ./appimagetool --appimage-extract
        ARCH=x86_64 ./squashfs-root/AppRun "$APPDIR" tsMuxerGUI-x86_64.AppImage
        ls -lh tsMuxerGUI-x86_64.AppImage

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: tsMuxeR-linux-x64-portable-qt
        path: tsMuxeR-linux-x64-portable.tar.gz
        retention-days: 30

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v6
      with:
        name: tsMuxerGUI-AppImage
        path: tsMuxerGUI-x86_64.AppImage
        retention-days: 30
